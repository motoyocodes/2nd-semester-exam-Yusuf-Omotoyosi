    [build]
      # Run install/build in the correct subdirectory, but the output is now at the root.
      command = "npm install --prefix vuejs-migration && npm run build --prefix vuejs-migration"
      # The final output directory is now the root 'dist' folder.
      publish = "dist"

    # Fixes the MIME type error for SPA client-side routing
    [[redirects]]
      from = "/*"
      to = "/index.html"
      status = 200