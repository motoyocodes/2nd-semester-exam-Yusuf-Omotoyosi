[build]
  # The build command runs from the repository root
  command = "npm install && npm run build --prefix vuejs-migration"
  # The final output directory relative to the repository root
  publish = "vuejs-migration/dist"

# Fixes the blank page 404 issue for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200